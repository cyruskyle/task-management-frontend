name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  feature-tests:
    name: Feature tests present
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-test-check')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require test changes for production changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          printf '%s\n' "$changed"

          production_changes="$(printf '%s\n' "$changed" | grep -E '^src/' | grep -Ev '(^src/test/|\.test\.[cm]?[jt]sx?$)' || true)"
          test_changes="$(printf '%s\n' "$changed" | grep -E '(^src/test/|\.test\.[cm]?[jt]sx?$)' || true)"

          if [ -n "$production_changes" ] && [ -z "$test_changes" ]; then
            echo "::error::Source code changed without any test changes. Add or update tests under src/test or a *.test.ts(x) file, or apply the 'skip-test-check' label for non-behavioral changes."
            exit 1
          fi

          echo "Test policy satisfied."
